<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#050b1a">
<style>
  :root {
    --azure: #2ea8ff; --coral: #ff6b57; --bg: #050b1a; --text: #dbe9ff; --muted: #7f97bd;
    --glass: rgba(9, 19, 42, .78); --edge: rgba(46, 168, 255, .45); --danger: #ff8f7e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(60vmax 40vmax at 10% -10%, rgba(46,168,255,.28), transparent 60%),
      radial-gradient(50vmax 40vmax at 100% 110%, rgba(255,107,87,.22), transparent 60%),
      linear-gradient(rgba(46,168,255,.07) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(46,168,255,.07) 1px, transparent 1px) 0 0 / 44px 44px,
      var(--bg);
    color: var(--text);
    font: 16px/1.45 "Chakra Petch", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 16px;
  }
  .card {
    position: relative; width: 100%; max-width: 560px; background: var(--glass);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--edge); border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(46,168,255,.08), 0 0 40px rgba(46,168,255,.22), 0 24px 60px rgba(0,0,0,.5);
  }
  .card::before, .card::after { content: ""; position: absolute; width: 22px; height: 22px; pointer-events: none; z-index: 3; }
  .card::before { top: 0; left: 0; border-top: 3px solid var(--coral); border-left: 3px solid var(--coral); border-top-left-radius: 10px; }
  .card::after { bottom: 0; right: 0; border-bottom: 3px solid var(--coral); border-right: 3px solid var(--coral); border-bottom-right-radius: 10px; }

  .join { padding: 32px 28px 28px; display: grid; gap: 14px; }
  .join h1 {
    margin: 0; font-size: 2.6rem; line-height: 1; font-weight: 700; letter-spacing: .01em;
    background: linear-gradient(90deg, var(--azure), #9fd8ff 45%, var(--coral)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .join p { margin: 0 0 4px; color: var(--muted); }
  label { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; color: #b9d3f5; }
  input {
    font: inherit; padding: 11px 13px; border: 1px solid var(--edge); border-radius: 6px;
    background: rgba(2, 8, 22, .6); color: var(--text); width: 100%;
  }
  input::placeholder { color: #54698c; }
  input:focus-visible { outline: none; border-color: var(--azure); box-shadow: 0 0 0 3px rgba(46,168,255,.25), 0 0 16px rgba(46,168,255,.35); }
  button {
    font: inherit; font-weight: 700; padding: 11px 18px; cursor: pointer; letter-spacing: .03em;
    border: 1px solid var(--coral); border-radius: 6px; background: var(--coral); color: #1d0804;
    box-shadow: 0 0 18px rgba(255,107,87,.45); transition: transform .1s, box-shadow .15s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 0 26px rgba(255,107,87,.7); }
  button:active:not(:disabled) { transform: translateY(1px) scale(.98); }
  button:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .err { color: var(--danger); min-height: 1.2em; font-size: .9rem; }

  .chat { display: none; height: min(82vh, 720px); }
  .chat.on { display: flex; flex-direction: column; }
  .join.off { display: none; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 12px 22px; border-bottom: 1px solid var(--edge); background: linear-gradient(90deg, rgba(46,168,255,.16), transparent); }
  .bar b { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
  .bar small { color: var(--muted); display: block; }
  .bar .btns { display: flex; gap: 8px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 10px var(--coral); margin-right: 8px; }
  .dot.ok { background: #5cf0ff; box-shadow: 0 0 10px #5cf0ff, 0 0 20px var(--azure); }
  .ghost { background: transparent; color: var(--azure); border-color: var(--edge); box-shadow: none; padding: 6px 12px; }
  .ghost:hover:not(:disabled) { box-shadow: 0 0 14px rgba(46,168,255,.5); border-color: var(--azure); }
  #people { border-bottom: 1px solid var(--edge); padding: 10px 16px; display: grid; gap: 8px; background: rgba(255,107,87,.07); max-height: 160px; overflow-y: auto; }
  #people .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: rgba(46,168,255,.5) transparent; }
  .msg {
    max-width: 82%; padding: 8px 12px 9px; overflow-wrap: anywhere; border-radius: 6px 14px 14px 6px;
    background: rgba(46,168,255,.10); border: 1px solid rgba(46,168,255,.35); border-left: 3px solid var(--azure);
    box-shadow: 0 0 18px rgba(46,168,255,.12);
  }
  .msg.mine { align-self: flex-end; border-radius: 14px 6px 6px 14px; background: rgba(255,107,87,.12); border-color: rgba(255,107,87,.45); border-left-width: 1px; border-right: 3px solid var(--coral); box-shadow: 0 0 18px rgba(255,107,87,.14); }
  .msg .who { font-size: .82rem; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .msg.mine .who > span.pf:not(.av) { color: #ffb1a5 !important; }
  .msg .time { font-size: .72rem; color: var(--muted); font-weight: 400; }
  .badge { color: var(--coral); border: 1px solid var(--coral); font-size: .62rem; font-weight: 700; letter-spacing: .12em; padding: 0 6px; border-radius: 3px; box-shadow: 0 0 8px rgba(255,107,87,.5); }
  .mod { margin-top: 5px; display: flex; gap: 6px; }
  .mod button, #people button { padding: 1px 9px; font-size: .75rem; background: transparent; color: var(--danger); border-color: rgba(255,107,87,.55); box-shadow: none; }
  .note { align-self: center; color: var(--muted); font-size: .8rem; border: 1px dashed rgba(46,168,255,.35); border-radius: 999px; padding: 1px 12px; }
  .send { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--edge); background: rgba(2,8,22,.45); }
  .send input { font-size: .95rem; padding: 7px 12px; }
  .send button { font-size: .95rem; padding: 7px 16px; }
  @media (pointer: coarse) { .send input { font-size: 16px; } }  /* stops phones zooming in when you tap the box */
  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: pop .22s ease-out; }
    .dot.ok { animation: pulse 2.4s ease-in-out infinite; }
  }
  @keyframes pop { from { transform: translateX(-8px) scale(.97); opacity: 0; } }
  .msg.mine { --from: 8px; }
  @keyframes pulse { 50% { box-shadow: 0 0 4px #5cf0ff, 0 0 8px var(--azure); } }
  .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background-size: cover; background-position: center; font-weight: 700; flex: none; border: 1px solid var(--edge); cursor: pointer; }
  .pf { cursor: pointer; }
  .pplleft { display: flex; align-items: center; gap: 8px; }
  .quote { margin: 4px 0; padding: 3px 8px; border-left: 3px solid var(--coral); background: rgba(255,255,255,.06); border-radius: 4px; font-size: .8rem; color: var(--muted); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote b { color: var(--text); }
  .mod button.rep { color: var(--azure); border-color: var(--edge); }
  .msg.flash { box-shadow: 0 0 0 2px var(--azure), 0 0 24px var(--azure); }
  #typing { min-height: 1.5em; padding: 0 16px 3px; font-size: .8rem; color: var(--muted); }
  .dots i { display: inline-block; width: 4px; height: 4px; margin-left: 3px; border-radius: 50%; background: var(--azure); }
  #replyBar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 14px; border-top: 1px solid var(--edge); background: rgba(46,168,255,.08); font-size: .85rem; }
  #replyBar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #replyBar button { padding: 0 8px; }
  #pcard { position: fixed; z-index: 20; width: 240px; padding: 14px; background: #0a1530; border: 1px solid var(--azure); border-radius: 10px; box-shadow: 0 0 30px rgba(46,168,255,.35), 0 14px 40px rgba(0,0,0,.6); }
  #pcard .ptop { display: flex; gap: 12px; align-items: center; }
  #pcard p { margin: 10px 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  #pcard button { padding: 5px 12px; font-size: .85rem; }
  dialog { background: #0a1530; color: var(--text); border: 1px solid var(--azure); border-radius: 12px; padding: 20px; width: min(92vw, 340px); box-shadow: 0 0 40px rgba(46,168,255,.35); }
  dialog::backdrop { background: rgba(2,6,18,.7); }
  dialog h2 { margin: 0 0 12px; font-size: 1.2rem; }
  .pfrow { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .pfrow div { display: grid; gap: 6px; }
  #avPrev { width: 72px; height: 72px; border-radius: 50%; background: center / cover rgba(46,168,255,.15); border: 1px solid var(--edge); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; flex: none; }
  .dlgBtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  @media (prefers-reduced-motion: no-preference) {
    .dots i { animation: blink 1.2s infinite both; }
    .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  /* Full-screen layout */
  body { padding: 0; display: block; }
  .card { max-width: none; width: 100%; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  .card::before, .card::after { border-radius: 0; }
  .chat { height: 100%; }
  .join { height: 100%; max-width: 440px; margin: 0 auto; align-content: center; }
  #log { padding: 18px max(16px, calc((100% - 860px) / 2)); }
  .bar, .send, #typing, #replyBar { padding-left: max(16px, calc((100% - 860px) / 2)); padding-right: max(16px, calc((100% - 860px) / 2)); }
  .msg { max-width: min(82%, 640px); }
</style>
</head>
<body>
<div class="card">

  <form class="join" id="joinForm" autocomplete="off">
    <h1>Join a room</h1>
    <p>No account needed. Anyone who enters the same room code can chat with you.</p>
    <label>Your name
      <input id="name" maxlength="24" required placeholder="e.g. Sam">
    </label>
    <label id="passWrap" hidden>Admin passcode
      <input id="pass" type="password">
    </label>
    <label>Room code
      <input id="room" maxlength="40" required placeholder="e.g. blue-otter-42">
    </label>
    <div class="err" id="err"></div>
    <button type="submit">Join room</button>
  </form>

  <section class="chat" id="chat">
    <div class="bar">
      <div>
        <b id="roomTitle"></b>
        <small><span class="dot" id="dot"></span><span id="status">Connecting…</span></small>
      </div>
      <div class="btns">
        <button type="button" class="ghost" id="meBtn">Profile</button>
        <button type="button" class="ghost" id="peopleBtn">People</button>
        <button type="button" class="ghost" id="leave">Leave</button>
      </div>
    </div>
    <div id="people" hidden></div>
    <div id="log" aria-live="polite"></div>
    <div id="typing" aria-live="polite"></div>
    <div id="replyBar" hidden></div>
    <form class="send" id="sendForm" autocomplete="off">
      <input id="text" maxlength="1000" placeholder="Type a message" disabled>
      <button type="submit" id="sendBtn" disabled>Send</button>
    </form>
  </section>

</div>

<div id="pcard" hidden></div>
<dialog id="editProf">
  <form id="profForm">
    <h2>Your profile</h2>
    <div class="pfrow"><span id="avPrev"></span>
      <div><button type="button" id="pickImg">Choose picture</button><button type="button" class="ghost" id="clearImg">Remove picture</button></div></div>
    <input type="file" id="imgFile" accept="image/*" hidden>
    <label>About you<input id="bio" maxlength="80" placeholder="A short bio"></label>
    <div class="dlgBtns"><button type="button" class="ghost" id="profCancel">Cancel</button><button type="submit">Save</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* ---------- Settings ---------- */
const ADMIN_NAME = 'Astro';   // entering this name makes you an admin
const ADMIN_PASSCODE = '';    // optional: set a passcode here so not just anyone can type the admin name
                              // (it is visible to anyone who views the page source)

/* No API keys needed. Messages travel through free public MQTT brokers
   (secure WebSockets). Messages, deletions and bans are stored as "retained"
   messages under the room's topic so people who join later get them. */
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt'
];
const PREFIX = 'anon-room-chat-v1/';
const MAX_SAVED = 500;

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const rnd = () => Math.random().toString(36).slice(2, 8);
const low = s => String(s || '').toLowerCase();
const isAdminName = n => low(n) === low(ADMIN_NAME);

let myUid = store.get('rc:uid');
if (!myUid) { myUid = rnd() + rnd(); store.set('rc:uid', myUid); }
const mySid = rnd();

let client = null, base = '', roomName = '', myName = '', isAdmin = false, brokerIdx = 0, everConnected = false;
const users = new Map();            // sid -> {name, uid, admin}
const msgs = new Map();             // id -> message
const deleted = new Set();          // deleted message ids
const bans = new Map();             // uid -> name
const bannedNames = new Set();      // lowercase names
let notes = [], renderQueued = false, saveTimer = null;
const profiles = new Map();         // uid -> {name, bio, avatar, admin}
const typers = new Map();           // sid -> {name, uid, until}
let replyTo = null, lastTyping = 0, draft = null, myProfile = {};
try { myProfile = JSON.parse(store.get('rc:profile') || '{}') || {}; } catch {}

function avatarEl(uid, name, size) {
  const p = profiles.get(uid), e = document.createElement('span');
  e.className = 'av pf'; e.style.width = e.style.height = size + 'px'; e.style.fontSize = Math.round(size * .5) + 'px';
  if (p && p.avatar) e.style.backgroundImage = `url(${p.avatar})`;
  else { e.textContent = (name || '?').trim().charAt(0).toUpperCase(); e.style.background = colorFor(uid) + '33'; e.style.color = colorFor(uid); }
  return e;
}
function actBtn(label, act, data, cls) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.dataset.act = act;
  Object.assign(b.dataset, data || {}); if (cls) b.className = cls; return b;
}
const cleanReply = r => (r && typeof r === 'object' && r.id)
  ? { id: String(r.id).slice(0, 60), name: String(r.name || '').slice(0, 24), text: String(r.text || '').slice(0, 80) } : null;

const isBanned = (uid, name) => bans.has(uid) || bannedNames.has(low(name));
const NAME_COLORS = ['#5cc0ff', '#ff8f7e', '#7ae7ff', '#ffb199', '#8fa8ff', '#ffa2a2'];
function colorFor(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % NAME_COLORS.length; return NAME_COLORS[h]; }

/* ---------- Rendering ---------- */
function queueRender() {
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function render() {
  const log = $('log');
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const items = [
    ...[...msgs.values()].map(m => ({ k: 'm', ts: m.ts, m })),
    ...notes.map(n => ({ k: 'n', ts: n.ts, n }))
  ].sort((a, b) => a.ts - b.ts);
  const frag = document.createDocumentFragment();
  for (const it of items) {
    if (it.k === 'n') {
      const d = document.createElement('div'); d.className = 'note'; d.textContent = it.n.text;
      frag.appendChild(d); continue;
    }
    const m = it.m, mine = m.uid === myUid;
    const d = document.createElement('div'); d.className = 'msg' + (mine ? ' mine' : '');
    d.dataset.mid = m.id; d.dataset.uid = m.uid; d.dataset.name = m.name;
    const who = document.createElement('div'); who.className = 'who';
    who.appendChild(avatarEl(m.uid, m.name, 22));
    const nm = document.createElement('span'); nm.className = 'pf'; nm.style.color = colorFor(m.uid);
    nm.textContent = mine ? 'You' : (profiles.get(m.uid)?.name || m.name); who.appendChild(nm);
    if (m.admin) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'ADMIN'; who.appendChild(b); }
    const t = document.createElement('span'); t.className = 'time';
    t.textContent = new Date(m.ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    who.appendChild(t); d.appendChild(who);
    if (m.reply) {
      const q = document.createElement('div'); q.className = 'quote'; q.dataset.jump = m.reply.id;
      const qn = document.createElement('b'); qn.textContent = m.reply.name; q.append(qn, ' ' + m.reply.text); d.appendChild(q);
    }
    const body = document.createElement('div'); body.textContent = m.text; d.appendChild(body);
    const mod = document.createElement('div'); mod.className = 'mod';
    mod.appendChild(actBtn('Reply', 'reply', { id: m.id }, 'rep'));
    if (isAdmin) {
      mod.appendChild(actBtn('Delete', 'del', { id: m.id }));
      if (!mine && !m.admin) mod.appendChild(actBtn('Remove user', 'ban', { uid: m.uid, name: m.name }));
    }
    d.appendChild(mod);
    frag.appendChild(d);
  }
  log.textContent = ''; log.appendChild(frag);
  if (nearBottom) log.scrollTop = log.scrollHeight;
}
function renderPeople() {
  const box = $('people'); box.textContent = '';
  const add = (name, admin, uid, you) => {
    const r = document.createElement('div'); r.className = 'row';
    const s = document.createElement('span'); s.className = 'pf'; s.textContent = you ? name + ' (you)' : name;
    r.dataset.uid = uid; r.dataset.name = name;
    const left = document.createElement('span'); left.className = 'pplleft'; left.append(avatarEl(uid, name, 22), s); r.appendChild(left);
    if (admin) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'ADMIN'; s.append(' ', b); }
    if (isAdmin && !you && !admin) {
      const x = document.createElement('button'); x.type = 'button'; x.textContent = 'Remove user';
      x.dataset.act = 'ban'; x.dataset.uid = uid; x.dataset.name = name; r.appendChild(x);
    }
    box.appendChild(r);
  };
  add(myName, isAdmin, myUid, true);
  for (const u of users.values()) add(u.name, u.admin, u.uid, false);
}
function addNote(text) { notes.push({ ts: Date.now(), text }); queueRender(); }
function setStatus(ok, text) { $('dot').classList.toggle('ok', ok); $('status').textContent = text; }
function updateCount() { setStatus(true, `Connected · ${users.size + 1} in room`); renderPeople(); }

/* ---------- Saved copy on this device ---------- */
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveHistory, 400); }
function saveHistory() {
  const m = [...msgs.values()].sort((a, b) => a.ts - b.ts).slice(-MAX_SAVED);
  store.set('rc:hist2:' + roomName, JSON.stringify({ m, d: [...deleted], b: [...bans], p: [...profiles] }));
}
function loadHistory() {
  try {
    const o = JSON.parse(store.get('rc:hist2:' + roomName) || '{}');
    (o.d || []).forEach(id => deleted.add(id));
    (o.p || []).forEach(([u, p]) => profiles.set(u, p));
    (o.b || []).forEach(([u, n]) => { bans.set(u, n); bannedNames.add(low(n)); });
    (o.m || []).forEach(m => { if (!deleted.has(m.id) && !isBanned(m.uid, m.name)) msgs.set(m.id, m); });
  } catch {}
  render(); $('log').scrollTop = $('log').scrollHeight;
}

/* ---------- Moderation ---------- */
function addMsg(m) {
  if (msgs.has(m.id) || deleted.has(m.id) || isBanned(m.uid, m.name)) return;
  msgs.set(m.id, m); queueRender(); scheduleSave();
}
function applyDelete(id) { deleted.add(id); msgs.delete(id); queueRender(); scheduleSave(); }
function applyBan(uid, name) {
  bans.set(uid, name); bannedNames.add(low(name));
  for (const [id, m] of msgs) if (isBanned(m.uid, m.name)) msgs.delete(id);
  for (const [sid, u] of users) if (isBanned(u.uid, u.name)) users.delete(sid);
  queueRender(); renderPeople(); scheduleSave();
  if (!isAdmin && (uid === myUid || low(name) === low(myName))) kicked();
}
function kicked() {
  store.set('rc:ban:' + roomName, '1');
  leaveRoom();
  $('err').textContent = 'You were removed from this room and cannot rejoin.';
}
function deleteMessage(id) {
  if (!isAdmin || !client || !client.connected) return;
  client.publish(base + '/chat/' + id, '', { qos: 1, retain: true });   // clears the stored copy
  client.publish(base + '/del/' + id, JSON.stringify({ id, name: myName, admin: true }), { qos: 1, retain: true });
  applyDelete(id);
}
function banUser(uid, name) {
  if (!isAdmin || !client || !client.connected) return;
  if (!confirm(`Remove ${name} from this room permanently?`)) return;
  client.publish(base + '/ban/' + uid, JSON.stringify({ uid, name, by: myName, admin: true }), { qos: 1, retain: true });
  applyBan(uid, name);
}
const fromAdmin = (m, name) => m.admin === true && isAdminName(name);

/* ---------- Networking ---------- */
function ctl(obj) {
  if (client && client.connected) client.publish(base + '/ctl', JSON.stringify(obj), { qos: 0 });
}
const me = () => ({ sid: mySid, uid: myUid, name: myName, admin: isAdmin });

function connect() {
  setStatus(false, 'Connecting…');
  client = mqtt.connect(BROKERS[brokerIdx], {
    clientId: 'rc_' + mySid + '_' + rnd(),
    clean: true, reconnectPeriod: 3000, connectTimeout: 7000,
    will: { topic: base + '/ctl', payload: JSON.stringify({ t: 'leave', ...me() }), qos: 0 }
  });

  client.on('connect', () => {
    everConnected = true;
    client.subscribe(base + '/#', { qos: 1 }, err => {
      if (err) { setStatus(false, 'Could not join room'); return; }
      $('text').disabled = false; $('sendBtn').disabled = false; $('text').focus();
      ctl({ t: 'join', ...me() });
      publishProfile();
      updateCount();
    });
  });

  client.on('message', (topic, buf) => {
    let m; try { m = JSON.parse(buf.toString()); } catch { return; }
    if (!m || typeof m !== 'object') return;
    const name = String(m.name || 'Anonymous').slice(0, 24);

    if (topic.startsWith(base + '/chat/')) {
      if (typeof m.text !== 'string' || !m.id) return;
      for (const [k, v] of typers) if (v.uid === String(m.uid || m.id)) typers.delete(k);
      addMsg({ id: String(m.id), reply: cleanReply(m.reply), uid: String(m.uid || m.id), name, text: m.text.slice(0, 1000),
               ts: Number(m.ts) || Date.now(), admin: fromAdmin(m, name) });
    } else if (topic.startsWith(base + '/del/')) {
      if (fromAdmin(m, name) && m.id) applyDelete(String(m.id));
    } else if (topic.startsWith(base + '/ban/')) {
      if (fromAdmin(m, name) && m.uid) applyBan(String(m.uid), String(m.name || ''));
    } else if (topic.startsWith(base + '/profile/')) {
      const uid = topic.slice((base + '/profile/').length);
      if (!uid || uid === myUid || String(m.uid) !== uid || isBanned(uid, name)) return;
      const av = typeof m.avatar === 'string' && m.avatar.length < 40000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(m.avatar) ? m.avatar : '';
      profiles.set(uid, { name, bio: String(m.bio || '').slice(0, 80), avatar: av, admin: fromAdmin(m, name) });
      queueRender(); renderPeople(); scheduleSave();
    } else if (topic === base + '/ctl' && m.sid !== mySid) {
      const uid = String(m.uid || m.sid);
      if (isBanned(uid, name)) return;
      const admin = fromAdmin(m, name);
      if (m.t === 'typing') { typers.set(m.sid, { name, uid, until: Date.now() + 3500 }); renderTyping(); return; }
      if (m.t === 'stop') { typers.delete(m.sid); renderTyping(); return; }
      if (m.t === 'join') {
        if (!users.has(m.sid)) addNote(name + ' joined');
        users.set(m.sid, { name, uid, admin }); updateCount();
        ctl({ t: 'here', ...me() });
      } else if (m.t === 'here') {
        users.set(m.sid, { name, uid, admin }); updateCount();
      } else if (m.t === 'leave') {
        typers.delete(m.sid);
        if (users.delete(m.sid)) addNote(name + ' left');
        updateCount();
      }
    }
  });

  client.on('reconnect', () => setStatus(false, 'Reconnecting…'));
  client.on('offline', () => setStatus(false, 'Offline'));
  client.on('error', () => {
    if (!everConnected && brokerIdx < BROKERS.length - 1) { client.end(true); brokerIdx++; connect(); }
    else if (!everConnected) setStatus(false, 'Could not reach a chat server');
  });
}

/* ---------- Entering and leaving ---------- */
function enter(name, room, pass) {
  const admin = isAdminName(name);
  if (admin && ADMIN_PASSCODE && pass !== ADMIN_PASSCODE) { $('err').textContent = 'Wrong admin passcode.'; return false; }
  if (!admin && store.get('rc:ban:' + room) === '1') { $('err').textContent = 'You were removed from this room and cannot rejoin.'; return false; }
  $('err').textContent = '';
  myName = name; roomName = room; base = PREFIX + room; isAdmin = admin;
  store.set('rc:name', name); store.set('rc:room', room); store.set('rc:active', '1');
  if (admin && ADMIN_PASSCODE) store.set('rc:pass', pass);
  $('roomTitle').textContent = 'Room: ' + room;
  $('joinForm').classList.add('off'); $('chat').classList.add('on');
  loadHistory(); publishProfile(); connect();
  return true;
}
function leaveRoom() {
  store.set('rc:active', '0');
  if (client) { ctl({ t: 'leave', ...me() }); client.end(true); client = null; }
  users.clear(); msgs.clear(); deleted.clear(); bans.clear(); bannedNames.clear(); notes = [];
  profiles.clear(); typers.clear(); setReply(null); $('typing').dataset.t = ''; $('typing').textContent = '';
  $('log').textContent = ''; $('people').hidden = true;
  $('text').disabled = true; $('sendBtn').disabled = true;
  $('chat').classList.remove('on'); $('joinForm').classList.remove('off');
  everConnected = false; brokerIdx = 0; isAdmin = false;
}

/* ---------- UI events ---------- */
function syncPassField() { $('passWrap').hidden = !(ADMIN_PASSCODE && isAdminName($('name').value.trim())); }
$('name').addEventListener('input', syncPassField);

$('joinForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim();
  const room = $('room').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
  if (!name || !room) { $('err').textContent = 'Enter a name and a room code.'; return; }
  enter(name, room, $('pass').value);
});
$('sendForm').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !client || !client.connected) return;
  const id = Date.now() + '-' + rnd();
  client.publish(base + '/chat/' + id,
    JSON.stringify({ id, uid: myUid, name: myName, text, ts: Date.now(), admin: isAdmin, reply: replyTo || undefined }),
    { qos: 1, retain: true });
  $('text').value = '';
  lastTyping = 0; ctl({ t: 'stop', ...me() }); setReply(null);
});
function onModClick(e) {
  const pf = e.target.closest('.pf');
  if (pf) {
    const h = pf.closest('[data-uid]');
    if (h) { const r = pf.getBoundingClientRect(); showProfile(h.dataset.uid, h.dataset.name, r.left, r.bottom + 4); }
    return;
  }
  const q = e.target.closest('.quote');
  if (q) { jumpTo(q.dataset.jump); return; }
  const b = e.target.closest('button[data-act]'); if (!b) return;
  if (b.dataset.act === 'del') deleteMessage(b.dataset.id);
  else if (b.dataset.act === 'ban') banUser(b.dataset.uid, b.dataset.name);
  else if (b.dataset.act === 'reply') {
    const m = msgs.get(b.dataset.id);
    if (m) setReply({ id: m.id, name: profiles.get(m.uid)?.name || m.name, text: m.text.slice(0, 80) });
  }
}
function jumpTo(id) {
  const el = $('log').querySelector('[data-mid="' + CSS.escape(id) + '"]'); if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
}
function setReply(r) {
  replyTo = r; const bar = $('replyBar'); bar.hidden = !r; bar.textContent = '';
  if (!r) return;
  const t = document.createElement('span'), b = document.createElement('b'); b.textContent = r.name;
  t.append('Replying to ', b, ': ' + r.text);
  const x = document.createElement('button'); x.type = 'button'; x.className = 'ghost'; x.textContent = '✕';
  x.setAttribute('aria-label', 'Cancel reply'); x.onclick = () => setReply(null);
  bar.append(t, x); $('text').focus();
}
function publishProfile() {
  const p = { uid: myUid, name: myName, bio: myProfile.bio || '', avatar: myProfile.avatar || '', admin: isAdmin };
  profiles.set(myUid, { name: myName, bio: p.bio, avatar: p.avatar, admin: isAdmin });
  if (client && client.connected) client.publish(base + '/profile/' + myUid, JSON.stringify(p), { qos: 1, retain: true });
  queueRender(); renderPeople(); scheduleSave();
}
function showProfile(uid, fallback, x, y) {
  const p = profiles.get(uid) || {}, name = p.name || fallback || 'Anonymous', c = $('pcard');
  c.textContent = '';
  const top = document.createElement('div'); top.className = 'ptop';
  const info = document.createElement('div'), h = document.createElement('b'); h.textContent = name; info.appendChild(h);
  if (p.admin) { const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = 'ADMIN'; info.append(' ', bd); }
  top.append(avatarEl(uid, name, 64), info); c.appendChild(top);
  const bio = document.createElement('p'); bio.textContent = p.bio || 'No bio yet.'; c.appendChild(bio);
  if (uid === myUid) { const eb = actBtn('Edit profile', 'x'); eb.onclick = openEditor; c.appendChild(eb); }
  else if (isAdmin && !p.admin) { const rb = actBtn('Remove user', 'x'); rb.onclick = () => { c.hidden = true; banUser(uid, name); }; c.appendChild(rb); }
  c.hidden = false;
  c.style.left = Math.max(8, Math.min(x, innerWidth - c.offsetWidth - 8)) + 'px';
  c.style.top = Math.max(8, Math.min(y, innerHeight - c.offsetHeight - 8)) + 'px';
}
function renderTyping() {
  const now = Date.now(); for (const [k, v] of typers) if (v.until < now) typers.delete(k);
  const names = [...new Set([...typers.values()].map(v => v.name))];
  const txt = !names.length ? '' : names.length === 1 ? names[0] + ' is typing'
    : names.length === 2 ? names[0] + ' and ' + names[1] + ' are typing' : 'Several people are typing';
  const el = $('typing'); if (el.dataset.t === txt) return;
  el.dataset.t = txt; el.textContent = '';
  if (txt) { el.append(txt + ' '); const d = document.createElement('span'); d.className = 'dots'; d.innerHTML = '<i></i><i></i><i></i>'; el.appendChild(d); }
}
setInterval(renderTyping, 700);

/* Profile editor */
function paintPrev() {
  const p = $('avPrev'); p.textContent = ''; p.style.backgroundImage = draft.avatar ? `url(${draft.avatar})` : '';
  if (!draft.avatar) p.textContent = (myName || '?').charAt(0).toUpperCase();
}
function openEditor() {
  draft = { avatar: myProfile.avatar || '' }; $('bio').value = myProfile.bio || '';
  paintPrev(); $('pcard').hidden = true; $('editProf').showModal();
}
$('meBtn').addEventListener('click', openEditor);
$('pickImg').onclick = () => $('imgFile').click();
$('clearImg').onclick = () => { draft.avatar = ''; paintPrev(); };
$('profCancel').onclick = () => $('editProf').close();
$('imgFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const S = 96, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), m = Math.min(img.width, img.height);
    g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
    g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
    draft.avatar = c.toDataURL('image/jpeg', 0.82); URL.revokeObjectURL(url); paintPrev();
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
};
$('profForm').addEventListener('submit', e => {
  e.preventDefault();
  myProfile = { avatar: draft.avatar, bio: $('bio').value.trim().slice(0, 80) };
  store.set('rc:profile', JSON.stringify(myProfile)); $('editProf').close(); publishProfile();
});

/* Right-click anyone to see their profile */
document.addEventListener('contextmenu', e => {
  const h = e.target.closest('#log [data-uid], #people [data-uid]'); if (!h) return;
  e.preventDefault(); showProfile(h.dataset.uid, h.dataset.name, e.clientX, e.clientY);
});
document.addEventListener('mousedown', e => { if (!e.target.closest('#pcard')) $('pcard').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('pcard').hidden = true; });

/* Typing indicator, and remember name/room as you type */
$('text').addEventListener('input', () => {
  const has = $('text').value.trim(), now = Date.now();
  if (has && now - lastTyping > 1500) { lastTyping = now; ctl({ t: 'typing', ...me() }); }
  else if (!has && lastTyping) { lastTyping = 0; ctl({ t: 'stop', ...me() }); }
});
$('name').addEventListener('input', () => store.set('rc:name', $('name').value));
$('room').addEventListener('input', () => store.set('rc:room', $('room').value));
$('log').addEventListener('click', onModClick);
$('people').addEventListener('click', onModClick);
$('peopleBtn').addEventListener('click', () => { $('people').hidden = !$('people').hidden; });
$('leave').addEventListener('click', leaveRoom);
window.addEventListener('beforeunload', () => { if (client) ctl({ t: 'leave', ...me() }); });

/* Restore saved name and room; rejoin automatically after a refresh. */
(function restore() {
  const n = store.get('rc:name'), r = store.get('rc:room');
  if (n) $('name').value = n;
  if (r) $('room').value = r;
  syncPassField();
  if (n && r && store.get('rc:active') === '1') enter(n, r, store.get('rc:pass') || '');
})();
</script>
