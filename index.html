<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Chat</title>
<style>
  :root {
    --bg: #e9efec; --panel: #fbfdfc; --ink: #14222b; --muted: #5d7079;
    --line: #cfdad5; --accent: #0f6b62; --accent-ink: #ffffff; --mine: #d6ebe6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 16px;
  }
  .card {
    width: 100%; max-width: 560px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .join { padding: 28px; display: grid; gap: 14px; }
  .join h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }
  .join p { margin: 0; color: var(--muted); }
  label { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; }
  input {
    font: inherit; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid #7cc4b9; outline-offset: 1px; }
  button {
    font: inherit; font-weight: 600; padding: 11px 18px; border: 0;
    border-radius: 8px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #b3261e; min-height: 1.2em; font-size: .9rem; }

  .chat { display: none; height: min(82vh, 720px); grid-template-rows: auto 1fr auto; }
  .chat.on { display: grid; }
  .join.off { display: none; }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .bar b { font-size: 1.05rem; }
  .bar small { color: var(--muted); display: block; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #c58b00; margin-right: 6px; }
  .dot.ok { background: #1c9a5a; }
  .bar button { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 7px 12px; }
  #log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow-wrap: anywhere; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-color: #b4d8d0; }
  .msg .who { font-size: .8rem; font-weight: 700; }
  .msg .time { font-size: .72rem; color: var(--muted); margin-left: 6px; font-weight: 400; }
  .note { align-self: center; color: var(--muted); font-size: .85rem; }
  .send { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  @media (prefers-reduced-motion: no-preference) { .msg { animation: pop .12s ease-out; } }
  @keyframes pop { from { transform: translateY(3px); opacity: .4; } }
</style>
</head>
<body>
<div class="card">

  <form class="join" id="joinForm" autocomplete="off">
    <h1>Join a room</h1>
    <p>No account needed. Anyone who enters the same room code can chat with you.</p>
    <label>Your name
      <input id="name" maxlength="24" required placeholder="e.g. Sam">
    </label>
    <label>Room code
      <input id="room" maxlength="40" required placeholder="e.g. blue-otter-42">
    </label>
    <div class="err" id="err"></div>
    <button type="submit">Join room</button>
  </form>

  <section class="chat" id="chat">
    <div class="bar">
      <div>
        <b id="roomTitle"></b>
        <small><span class="dot" id="dot"></span><span id="status">Connecting…</span></small>
      </div>
      <button type="button" id="leave">Leave</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <form class="send" id="sendForm" autocomplete="off">
      <input id="text" maxlength="1000" placeholder="Type a message" disabled>
      <button type="submit" id="sendBtn" disabled>Send</button>
    </form>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* No API keys needed. Messages travel through free public MQTT brokers
   (over secure WebSockets), using the room code as the topic name. */
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt'
];
const PREFIX = 'anon-room-chat-v1/';

const $ = id => document.getElementById(id);
const myId = Math.random().toString(36).slice(2, 10);
let client = null, topic = '', myName = '', brokerIdx = 0, everConnected = false, users = new Map();

function colorFor(s) {
  let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 32%)`;
}
function addNote(text) {
  const d = document.createElement('div'); d.className = 'note'; d.textContent = text;
  $('log').appendChild(d); scroll();
}
function addMsg(m) {
  const mine = m.id === myId;
  const d = document.createElement('div'); d.className = 'msg' + (mine ? ' mine' : '');
  const who = document.createElement('div'); who.className = 'who';
  who.style.color = colorFor(m.id);
  who.textContent = mine ? 'You' : m.name;
  const t = document.createElement('span'); t.className = 'time';
  t.textContent = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  who.appendChild(t);
  const body = document.createElement('div'); body.textContent = m.text;
  d.append(who, body); $('log').appendChild(d); scroll();
}
function scroll() { const l = $('log'); l.scrollTop = l.scrollHeight; }
function setStatus(ok, text) { $('dot').classList.toggle('ok', ok); $('status').textContent = text; }
function updateCount() {
  setStatus(true, `Connected · ${users.size + 1} in room`);
}
function pub(obj) {
  if (client && client.connected) client.publish(topic, JSON.stringify(obj), { qos: 0 });
}

function connect() {
  setStatus(false, 'Connecting…');
  client = mqtt.connect(BROKERS[brokerIdx], {
    clientId: 'rc_' + myId + '_' + Math.random().toString(36).slice(2, 6),
    clean: true, reconnectPeriod: 3000, connectTimeout: 7000,
    will: { topic, payload: JSON.stringify({ t: 'leave', id: myId, name: myName }), qos: 0 }
  });

  client.on('connect', () => {
    everConnected = true;
    client.subscribe(topic, { qos: 0 }, err => {
      if (err) { setStatus(false, 'Could not join room'); return; }
      $('text').disabled = false; $('sendBtn').disabled = false; $('text').focus();
      pub({ t: 'join', id: myId, name: myName });
      updateCount();
    });
  });

  client.on('message', (_, buf) => {
    let m; try { m = JSON.parse(buf.toString()); } catch { return; }
    if (!m || typeof m !== 'object') return;
    const name = String(m.name || 'Anonymous').slice(0, 24);
    if (m.t === 'msg' && typeof m.text === 'string') {
      addMsg({ id: String(m.id), name, text: m.text.slice(0, 1000), ts: Number(m.ts) || Date.now() });
    } else if (m.id !== myId) {
      if (m.t === 'join') {
        if (!users.has(m.id)) addNote(name + ' joined');
        users.set(m.id, name); updateCount();
        pub({ t: 'here', id: myId, name: myName });
      } else if (m.t === 'here') {
        users.set(m.id, name); updateCount();
      } else if (m.t === 'leave') {
        if (users.delete(m.id)) addNote(name + ' left');
        updateCount();
      }
    }
  });

  client.on('reconnect', () => setStatus(false, 'Reconnecting…'));
  client.on('offline', () => setStatus(false, 'Offline'));
  client.on('error', () => {
    if (!everConnected && brokerIdx < BROKERS.length - 1) {
      client.end(true); brokerIdx++; connect();
    } else if (!everConnected) {
      setStatus(false, 'Could not reach a chat server');
    }
  });
}

function leaveRoom() {
  if (client) { pub({ t: 'leave', id: myId, name: myName }); client.end(true); client = null; }
  users.clear(); $('log').textContent = '';
  $('text').disabled = true; $('sendBtn').disabled = true;
  $('chat').classList.remove('on'); $('joinForm').classList.remove('off');
  everConnected = false; brokerIdx = 0;
}

$('joinForm').addEventListener('submit', e => {
  e.preventDefault();
  myName = $('name').value.trim();
  const room = $('room').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
  if (!myName || !room) { $('err').textContent = 'Enter a name and a room code.'; return; }
  $('err').textContent = '';
  topic = PREFIX + room;
  $('roomTitle').textContent = 'Room: ' + room;
  $('joinForm').classList.add('off'); $('chat').classList.add('on');
  addNote('Messages are live only. You will not see anything sent before you joined.');
  connect();
});

$('sendForm').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  pub({ t: 'msg', id: myId, name: myName, text, ts: Date.now() });
  $('text').value = '';
});

$('leave').addEventListener('click', leaveRoom);
window.addEventListener('beforeunload', () => { if (client) pub({ t: 'leave', id: myId, name: myName }); });
</script>
</body>
</html>
